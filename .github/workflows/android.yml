name: Сборка Android-приложения
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Проект Android
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Иконка
        working-directory: android-app
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert ../public/icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Подпись и сборка
        working-directory: android-app/android
        run: |
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Положить файл на сайт
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk public/nordika.apk
          git config user.name "nordika-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/nordika.apk
          git commit -m "Новая версия приложения Android [skip ci]" || echo "без изменений"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: Nordika-apk
          path: public/nordika.apk
