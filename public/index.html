<script>/*PICS*/window.PIC={};[['herop',5],['hall',6],['farm',6],['sawmill',6],['quarry',6],['ironmine',6],['storehouse',6],['vault',6],['barracks',6],['oracle',6],['silvermine',5],['plot',1],['spear',7],['archer',7],['cav',7],['hero',7]].forEach(function(a){PIC[a[0]]=[];for(var i=1;i<=a[1];i++)PIC[a[0]].push('/img/'+a[0]+i+'.webp'+(/^(spear|archer|cav)$/.test(a[0])?'?v=2':''));});</script>

<script>
'use strict';
const {fmtApprox,RES,RI,B,BORDER,U,WEAK,TECH,QUESTS,MAXL,TMAX,lvl,slots,cap,rate,prodAt,upCost,upSecs,canUp,canAfford,maxBatch,trainSecs,techCost,techSecs,gatherSecs,marchSecs,fmt,fmtT,fmtRes,fmtComp,verdict,battle,carryOf,TIERN,TIER_NEED,MAXT,HSK,MAXHL,MAXSK,tierOf,heroOf,tmul,unitName,xpNeed,tierCost,tierSecs}=Core;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=o=>Object.values(o).reduce((x,y)=>x+(y||0),0);

let S=null,TOKEN='',off=0,seenLog=0,busy=false,lastSync=0,syncing=false,failCount=0;
const ui={clan:null,clanAt:0,leaveSure:false,tab:'city',tn:{spear:10,archer:10,cav:10},tt:{},modal:null,rank:null,rankAt:0,authMode:'login'};
try{TOKEN=localStorage.getItem('sp_token')||'';}catch(e){}
if(window.DEMO)TOKEN='demo';

/* ---------- связь с сервером ---------- */
async function call(method,path,body){
  if(window.DEMO)return window.demoCall(method,path,body);
  const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let r;
  try{r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});}
  catch(e){const err=new Error('Нет связи с сервером');err.net=true;throw err;}
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const err=new Error(j.error||'Ошибка '+r.status);err.status=r.status;throw err;}
  return j;
}
let lastNow=0;
function setInc(a){
  const known=ui.incSeen||(ui.incSeen={});
  const fresh=a.filter(x=>!known[x.id]);
  a.forEach(x=>known[x.id]=1);
  ui.inc=a;
  if(fresh.length){try{window.Snd&&Snd.sfx('horn');}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}toast('⚔ На вас идёт нападение: '+fresh[0].name);}
  incDraw();
}
function incDraw(){
  const el=$('inc');if(!el)return;
  const now=Date.now()+off,l=(ui.inc||[]).filter(x=>x.eta>now);
  if(!l.length){el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML='⚔ <b>На вас идёт нападение!</b> '+l.map(x=>esc(x.name)+' через '+fmtT(Math.max(0,Math.ceil((x.eta-now)/1000)))).join(' · ')+'<br><span class="sm">Отправьте войска в поход, потратьте ресурсы или поднимите щит в магазине.</span>';
}
function apply(j){
  if(j.now<lastNow)return;lastNow=j.now;
  off=j.now-Date.now();Core.setNow(()=>Date.now()+off);
  Core.CFG.t=j.cfg.t;
  const first=S===null;
  S=j.state;Core.use(S);MINES=j.mines||MINES;setInc(j.inc||[]);
  const fresh=S.log.filter(e=>e.t>seenLog);
  if(!first&&window.Snd&&fresh.some(e=>e.k==='bad'&&/разграбил|напал|набег/i.test(e.txt)))Snd.sfx('alarm');
  if(!first){fresh.slice(0,2).reverse().forEach(e=>toast(e.txt.length>70?e.txt.slice(0,67)+'…':e.txt));}
  for(const e of S.log)if(e.t>seenLog)seenLog=e.t;
  lastSync=Date.now();
}
async function sync(){
  if(syncing||!TOKEN)return;syncing=true;
  try{apply(await call('GET','/api/state'));failCount=0;$('net').hidden=true;render(true);}
  catch(e){if(e.status===401)logout(true);else{failCount++;if(failCount>=2)$('net').hidden=false;}}
  finally{syncing=false;}
}
async function act(a,arg){
  if(busy)return;busy=true;
  try{apply(await call('POST','/api/act',{a,arg}));$('net').hidden=true;}
  catch(e){if(e.status===401)logout(true);else toast(e.message);}
  finally{busy=false;}
  render();
  if(ui.orOpen&&!$('modal').hidden)oracleSheet();
  if(ui.tvOpen&&!$('modal').hidden)tavernSheet(true);
  if((ui.eqOpen||ui.fgOpen)&&!$('modal').hidden){if(ui.eqSel&&ui.eqSel.id&&!S.eq.inv.some(x=>x.id===ui.eqSel.id))ui.eqSel=null;if(ui.fgOpen)forgeSheet();else eqSheet();}
}

/* ---------- вход ---------- */
function authBg(on){const b=$('authbg'),v=$('authV');if(!b||!v)return;b.hidden=!on;if(on&&!calm()){v.play().catch(()=>{});}else if(v.pause)v.pause();}
function showAuth(){ $('app').hidden=true;$('auth').hidden=false;authBg(true);setMode(ui.authMode); }
function setMode(m){
  ui.authMode=m;
  $('tabLogin').className='btn '+(m==='login'?'on':'ghost');$('tabReg').className='btn '+(m==='reg'?'on':'ghost');
  $('auth-go').textContent=m==='login'?'Войти':'Начать игру';
  $('in-pw').autocomplete=m==='login'?'current-password':'new-password';
  $('auth-err').textContent='';
}
async function doAuth(){
  const name=$('in-name').value,password=$('in-pw').value;
  $('auth-err').textContent='';$('auth-go').classList.add('off');
  try{
    const j=await call('POST',ui.authMode==='login'?'/api/login':'/api/register',{name,password,ref:refCode()});
    TOKEN=j.token;try{localStorage.setItem('sp_token',TOKEN);}catch(e){}
    $('in-pw').value='';S=null;seenLog=0;lastNow=0;
    await startGame();
  }catch(e){$('auth-err').textContent=e.message;}
  finally{$('auth-go').classList.remove('off');}
}
function logout(silent){
  if(!silent)call('POST','/api/logout').catch(()=>{});
  TOKEN='';S=null;try{localStorage.removeItem('sp_token');}catch(e){}
  closeModal();showAuth();
}
async function startGame(){
  try{apply(await call('GET','/api/state'));}
  catch(e){if(e.status===401){logout(true);return;}$('auth').hidden=false;$('auth-err').textContent=e.message;return;}
  $('auth').hidden=true;authBg(false);$('app').hidden=false;
  {const b=$('snd');if(b)b.textContent=sndLabel();}
  render();
}

/* ---------- отрисовка ---------- */
function toast(txt){
  if(window.Snd){if(/^Победа/.test(txt))Snd.sfx('win');else if(/^Поражение/.test(txt))Snd.sfx('lose');}
  const el=$('toast');el.textContent=txt;el.hidden=false;
  clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true;},3200);
}
function cpHTML(k,val,attrs){
  if(k==='haste')return `<span class="cp">${IH}<span class="cl">Ускорение</span> ${val}</span>`;
  if(k==='gems')return `<span class="cp">${IG}<span class="cl">Рунные камни</span> ${val}</span>`;
  return `<span class="cp"${attrs||''}>${ricon(k)}<span class="cl">${RI[k].n}</span> ${fmt(val)}</span>`;
}
const IH='<img class="ri" src="/img/ui-haste.webp?v=1" alt="">',IG='<img class="ri" src="/img/ui-gem.webp?v=1" alt="">';
const ricon=k=>`<img class="ri" src="/img/res-${k}.webp?v=1" alt="">`;
function costHTML(c){
  return `<div class="costs">${Object.keys(c).map(k=>cpHTML(k,c[k],` data-res="${k}" data-need="${c[k]}"`)).join('')}</div>`;
}
function effect(id,L){
  const b=B[id],nx=L<MAXL;
  if(b.res)return `Добыча: ${fmt(prodAt(id,L))}/ч`+(nx?` → ${fmt(prodAt(id,L+1))}/ч`:'');
  if(id==='silvermine')return L?`Мест для раненых: ${Core.hutCap({b:{silvermine:L}})}`+(nx?` → ${Core.hutCap({b:{silvermine:L+1}})}`:''):'Лечит раненых; без неё павшие не возвращаются';

function photoToData(file){
  return new Promise((ok,no)=>{
    const r=new FileReader();r.onerror=()=>no(new Error('Не удалось прочитать файл'));
    r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('Это не картинка'));
      im.onload=()=>{
        const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');
        const m=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-m)/2,sy=(im.naturalHeight-m)/2;
        g.drawImage(im,sx,sy,m,m,0,0,96,96);
        let d=c.toDataURL('image/webp',0.8);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',0.8);
        ok(d);
      };im.src=r.result;};
    r.readAsDataURL(file);
  });
}

  const pick=(cx,cy)=>{
    const r=rect(),px=(cx-r.left)*(r.width?r.width/r.width:1),py=cy-r.top;let best=null,bd=1e9;
    wmHit.forEach(o=>{const mx=o.x,my=o.y-o.h*.45,d=Math.hypot(px-mx,py-my),tol=Math.max(22,o.h*.8);if(d<=tol&&d<bd){bd=d;best=o;}});

function modalPreview(){
  const t=getTg(ui.modal);if(!t)return;
  const s=readSend(),tot=sum(s),go=$('go');
  if(S.marches.length>=slots(lvl('hall'))){$('pv').textContent='Все отряды заняты. Дождитесь возвращения.';go.classList.add('off');return;}
  if(!tot){$('pv').textContent='Выберите, кого отправить.';go.classList.add('off');return;}
  go.classList.remove('off');
  if(t.kind==='mine'){$('pv').textContent=mineV(t.mine).o?'Рудник занят: исход боя неизвестен. Раненые вернутся домой.':`Рудник свободен, отряд займёт его без боя. Путь ${fmtT(marchSecs(t.dist))} в одну сторону.`;return;}
  if(t.kind==='node'){
    const cr=carryOf(s);$('pv').textContent=`Унесёте до ${fmt(Math.min(cr,sum(t.loot)))} ед. Туда и обратно ${fmtT(marchSecs(t.dist)*2+gatherSecs())}.`;return;
  }
  const r=battle(s,t.comp,1+0.06*S.tech.atk,t.defb);
  const loss=tot?Math.round(sum(r.lostA)/tot*100):0;
  const q=r.win?(loss<=10?['good','Лёгкая победа']:loss<=40?['good','Победа']:['warn','Тяжёлая победа']):(loss>=90?['bad','Разгром']:['bad','Поражение']);
  const qh=`<b class="vq ${q[0]}">${q[1]}</b> · потери отряда ~${loss}%<br>`;
  if(t.kind==='player'){
    $('pv').innerHTML=qh+(r.win?'По разведке вы побеждаете. Данные могли устареть, а щит цели сорвёт поход.':'По разведке вы проигрываете.');return;
  }

}

    case 'eqpg':ui.eqPg=Math.max(0,(ui.eqPg||0)+parseInt(arg,10));ui.eqMenu=null;eqSheet();return;
    case 'equip':case 'unequip':case 'scrap':case 'sellx':ui.eqMenu=null;act2(act,arg);return;
    case 'eqsel':{const [a,v]=String(arg).split(':');if(!ui.fgOpen&&(a==='r'||a==='x')){ui.eqMenu=a==='r'?{rec:v.replace('|',':')}:{scr:v};eqSheet();return;}if(!ui.fgOpen){if(ui.eqLP){ui.eqLP=false;return;}ui.eqMenu=a==='i'?{id:v}:{slot:v};eqSheet();return;}if(ui.eqMulti&&ui.fgOpen&&a==='i'){const pk=ui.eqPick=ui.eqPick||{};pk[v]=!pk[v];ui.eqConf=false;forgeSheet();return;}ui.eqSel=a==='i'?{id:v}:{slot:v};if(ui.fgOpen)forgeSheet();else eqSheet();return;}
    case 'frame':saveAv({fr:Number(arg)});return;
    case 'avclr':saveAv({clear:true});return;
    case 'top':topSheet();return;
    case 'tsub':ui.topSub=arg;topSheet(true);return;
    case 'profp':closeModal();ui.tab='chat';ui.sub='world';ui.soc.peer=null;render();openProf({id:arg}).then(()=>{loadSoc();});return;
    case 'help':helpSheet();return;
    case 'cl':if(ui.cl)clSheet(false);else loadChangelog(false).then(()=>clSheet(false));return;
    case 'clx':try{localStorage.setItem(CLK,(ui.cl&&ui.cl[0].id)||'');}catch(e){}closeModal();return;
    case 'qall':ui.qall=!ui.qall;render();return;
    case 'bsheet':bSheet(arg);return;
    case 'usheet':uSheet(arg);return;
    case 'sheetx':closeModal();return;
    case 'wpvp':act2('ptarget',arg).then(()=>{const t=S.targets.find(x=>x.kind==='player'&&x.pid===arg);closeModal();if(t)openModal(t.id);});return;
    case 'wscout':act2('ptarget',arg).then(()=>{const t=S.targets.find(x=>x.kind==='player'&&x.pid===arg);if(!t)return;return act2('scout',t.id).then(()=>openModal(t.id));});return;
    case 'wdm':closeModal();ui.tab='chat';ui.sub='dm';ui.soc.peer=arg;ui.soc.prof=null;ui.soc.d&&(ui.soc.d.thread=null);render();loadSoc().then(()=>stick($('dbox')));return;
    case 'revenge':act2('revenge',arg).then(()=>{const t=S.targets.find(x=>x.kind==='player'&&x.pid===arg);if(t)openModal(t.id);});return;
    case 'sub':ui.sub=arg;ui.soc.peer=null;ui.soc.prof=null;render();loadSoc();if(arg==='clan')loadClan();return;
    case 'prof':openProf({id:arg});return;
    case 'profn':closeModal();ui.tab='chat';ui.sub='world';ui.soc.peer=null;openProf({name:arg}).then(()=>{loadSoc();});return;
    case 'profx':ui.soc.prof=null;render();return;
    case 'fsearch':{const el=$('fname');const n=el?el.value.trim():'';if(n)openProf({name:n});return;}
    case 'dmopen':ui.sub='dm';ui.soc.peer=arg;ui.soc.prof=null;ui.soc.d&&(ui.soc.d.thread=null);render();loadSoc().then(()=>stick($('dbox')));return;
    case 'dmback':ui.soc.peer=null;render();loadSoc();return;
    case 'wsay':chatSend('w');return;
    case 'dsay':chatSend('d');return;
    case 'fadd':case 'faccept':case 'fdecline':case 'fremove':case 'block':case 'unblock':sact(act,{pid:arg});return;
    case 'report':sact('report',{pid:arg});return;
    case 'ccreate':cact('create',{name:$('cn').value,tag:$('ct').value});return;
    case 'cjoin':cact('join',{id:arg});return;
    case 'cleave':if(!ui.leaveSure){ui.leaveSure=true;render();setTimeout(()=>{ui.leaveSure=false;if(ui.tab==='clan')render();},4000);return;}ui.leaveSure=false;cact('leave');return;
    case 'ckick':cact('kick',{pid:arg});return;
    case 'ctrans':cact('transfer',{pid:arg});return;
    case 'cnews':{const el=$('cnews');const t=el?el.value.trim():'';if(!t)return;el.value='';cact('news',{text:t});return;}
    case 'csay':chatSend('c');return;
    case 'cask':cact('ask',{kind:arg});return;
    case 'chelp':cact('help',{id:arg});return;
    case 'chelpall':cact('helpall');return;
    case 'tnmax':{const k=arg,tr=Math.max(1,Math.min(Core.maxTier(),ui.tt[k]||Core.maxTier()));let best=1;for(let n=1;n<=maxBatch();n++){if(canAfford(Core.costOf(k,tr,n)))best=n;else break;}ui.tn[k]=best;render();return;}
    case 'tn':{const[k,d]=arg.split(':');ui.tn[k]=Math.max(1,Math.min(maxBatch(),ui.tn[k]+parseInt(d,10)));render();return;}
    case 'atk':openModal(arg);return;
    case 'step':{const[k,d]=arg.split(':');const el=$('sn-'+k);if(el){el.value=Math.max(0,Math.min(S.troops[k],(parseInt(el.value,10)||0)+parseInt(d,10)));modalPreview();}return;}
    case 'papply':{const c=(S.presets||[])[Number(arg)];if(c){for(const k in S.troops){const el=$('sn-'+k);if(el)el.value=Math.min(S.troops[k],c[k]||0);}modalPreview();}return;}
    case 'pset':{const i=Number(arg),c=readSend();if(!sum(c)){toast('Сначала выберите войско');return;}act2('preset',{i,comp:c}).then(()=>{toast('Сохранено: Армия '+(i+1));const tid=ui.modal,sv={};for(const k in S.troops){const el=$('sn-'+k);sv[k]=el?el.value:0;}openModal(tid);for(const k in S.troops){const el=$('sn-'+k);if(el)el.value=sv[k];}modalPreview();});return;}
    case 'half':for(const k in S.troops){const el=$('sn-'+k);if(el)el.value=Math.floor(S.troops[k]/2);}modalPreview();return;
    case 'all':for(const k in S.troops){const el=$('sn-'+k);if(el)el.value=S.troops[k];}modalPreview();return;
    case 'cancel':closeModal();return;
    case 'go':{const id=ui.modal,s=readSend(),n=S.marches.length;closeModal();ui.tab='map';act2('march',{id,send:s}).then(()=>{if(S.marches.length>n&&window.Snd)Snd.sfx('march');});return;}
    case 'train':act2('train',{k:arg,n:ui.tn[arg],t:Math.max(1,Math.min(Core.maxTier(),ui.tt[arg]||Core.maxTier()))});return;
    case 'tsel':{const[k,t]=arg.split(':');ui.tt[k]=+t;render();return;}
    case 'tierup':{const[k,t]=arg.split(':');act2('tierup',{k,to:+t});return;}
    case 'logout':logout(false);return;
    case 'tglink':call('POST','/api/tg',{a:'link'}).then(j=>{const b=$('tgbox');if(b)b.innerHTML=`<p>Нажмите кнопку, откроется Телеграм. Там нажмите «Запустить» (Start). Код действует 15 минут.</p><a class="btn small" href="${j.url}" target="_blank" rel="noopener">Открыть @${esc(j.bot)}</a> <button class="btn small ghost" data-act="tgchk" type="button">Я нажал Start</button>`;}).catch(e=>toast(e.message));return;
    case 'tgchk':tgLoad();return;
    case 'tgoff':call('POST','/api/tg',{a:'unlink'}).then(tgLoad).catch(e=>toast(e.message));return;
    case 'invshare':{const l=inviteLink(),txt='Играй со мной в Nordika: сердце фьорда, стратегию про викингов. Ссылка: '+l;
      if(navigator.share){navigator.share({title:'Nordika',text:txt,url:l}).catch(()=>{});}
      else{try{navigator.clipboard.writeText(l).then(()=>toast('Ссылка скопирована'),()=>{const i=$('invl');if(i){i.select();}toast('Выделите и скопируйте ссылку');});}catch(e){const i=$('invl');if(i)i.select();}}return;}
    case 'snd':sndCycle();return;
    case 'switch':{const b=$('sw');if(!ui.swSure){ui.swSure=true;if(b){b.textContent='Точно выйти?';b.classList.add('sure');}setTimeout(()=>{ui.swSure=false;const c=$('sw');if(c){c.textContent='Сменить аккаунт';c.classList.remove('sure');}},4000);return;}ui.swSure=false;logout(false);return;}
    case 'demo':window.demoControl(arg);seenLog=0;lastNow=0;S=null;sync();return;
    default:act2(act,arg);
  }
}
function act2(a,arg){return act(a,arg);}
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.tn){const k=t.dataset.tn;ui.tn[k]=Math.max(1,Math.min(maxBatch()||1,parseInt(t.value,10)||1));render();}});
function boot(){
  document.querySelectorAll('img[data-l]').forEach(i=>{i.src=(window.LOGO&&LOGO[i.dataset.l])||('/img/'+i.dataset.l+'.webp?v=2');});
  buildStatic();
  $('view').addEventListener('scroll',()=>{
    ui.sat=Date.now();
    const hd=$('head'),t=$('view').scrollTop;
    if(ui.tab!=='city')return;
    if(t>70&&!hd.classList.contains('mini')){hd.classList.add('mini');$('h1').classList.remove('off');}
    else if(t<8&&hd.classList.contains('mini')){hd.classList.remove('mini');$('h1').classList.add('off');}
  },{passive:true});
  (function(){const m=$('modal');if(!m||!window.MutationObserver)return;
  new MutationObserver(()=>{const sh=m.querySelector('.sheet');if(!sh||m.hidden||sh.querySelector('.eqx,.eqcl,[data-act="sheetx"]')||sh.classList.contains('eqf')||sh.classList.contains('fgw'))return;
    sh.insertAdjacentHTML('beforeend','<button class="btn ghost" data-act="sheetx" type="button" style="display:block;margin:10px auto 0;min-width:50%">Закрыть</button>');}).observe(m,{childList:true,subtree:true});})();
document.addEventListener('change',e=>{if(e.target&&e.target.id==='pf'&&e.target.files&&e.target.files[0])sendPhoto(e.target.files[0]);});
(function(){let tm=null,sx=0,sy=0;
  const stop=()=>{clearTimeout(tm);tm=null;};
  document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.eqf .eqs[data-arg]');if(!b||ui.fgOpen)return;ui.eqLP=false;sx=e.clientX;sy=e.clientY;stop();
    tm=setTimeout(()=>{tm=null;const[a,v]=String(b.dataset.arg).split(':');ui.eqLP=true;ui.eqMenu=a==='i'?{id:v}:{slot:v};try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}eqSheet();setTimeout(()=>{ui.eqLP=false;},400);},450);});
  document.addEventListener('pointermove',e=>{if(tm&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)stop();});
  document.addEventListener('pointerup',stop);document.addEventListener('pointercancel',stop);
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.eqf'))e.preventDefault();});
})();
document.addEventListener('click',e=>{
    if(e.target.id==='modal'){closeModal();return;}
    window.Snd&&Snd.unlock();
    const el=e.target.closest('[data-act]');if(!el)return;
    if(el.tagName==='A')e.preventDefault();
    if(el.classList.contains('off')||el.disabled){window.Snd&&Snd.sfx('err');return;}
    sndFor(el.dataset.act);
    onAct(el.dataset.act,el.dataset.arg);
  });
  document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('sn'))modalPreview();});
  $('tabLogin').onclick=()=>setMode('login');$('tabReg').onclick=()=>setMode('reg');
  $('auth-go').onclick=doAuth;
  $('in-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
  setInterval(()=>{
    if(!S||$('app').hidden)return;
    live();
    if(Date.now()-lastSync>2500&&dueSoon())sync();
  },1000);
  setInterval(()=>{if(S&&!document.hidden&&!ui.modal)sync();},15000);
  setInterval(()=>{if(S)incDraw();},1000);
  const avT=setInterval(()=>{if(S&&!$('app').hidden){clearInterval(avT);loadAvatar();}},1500);
  const clT=setInterval(()=>{if(S&&S.introDone&&!$('app').hidden){clearInterval(clT);loadChangelog(true);}},3000);
  setInterval(()=>{if(S&&!document.hidden&&ui.tab==='map'&&ui.msub==='world')loadWorld();},12000);
  setInterval(()=>{if(S&&!document.hidden&&ui.tab==='map'&&ui.msub==='boss')loadBoss();},15000);
  setInterval(()=>{if(S&&!document.hidden&&!$('app').hidden&&!cbusy&&(ui.tab==='clan'||(ui.tab==='chat'&&ui.sub==='clan')||Date.now()-ui.clanAt>30000))loadClan();},5000);
  setInterval(()=>{if(S&&!document.hidden&&!$('app').hidden&&(ui.tab==='chat'||Date.now()-ui.soc.at>20000))loadSoc();},4000);
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target){const m={cnews:'cnews',cmsg:'csay',wmsg:'wsay',dmsg:'dsay',fname:'fsearch'}[e.target.id];if(m){e.preventDefault();onAct(m);}}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S)sync();});
  if(!window.DEMO&&'serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const hs=document.querySelector('#heroV source');
  if(hs)hs.addEventListener('error',()=>{heroOK=false;$('hero').hidden=true;});
  document.addEventListener('visibilitychange',()=>{if(!heroOK)return;const v=ui.tab==='troops'?$('heroB'):$('heroV');if(!v)return;if(document.hidden)v.pause();else if((ui.tab==='city'||ui.tab==='troops')&&!calm())v.play().catch(()=>{});});
  if(TOKEN)startGame();else showAuth();
}
boot();
</script>
</body>
</html>
