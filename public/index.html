.eqs.r2::after{animation-duration:3s;background:linear-gradient(100deg,transparent,rgba(255,235,170,.5),transparent)}
.eqs.r2{animation:eqglow 2.6s ease-in-out infinite}
.eqs.r2 .eqi{animation:eqbr 2.6s ease-in-out infinite}

.eqs.t-ring1::before,.eqs.t-ring2::before{content:"✦";position:absolute;left:52%;top:30%;font-size:12px;color:#fff;text-shadow:0 0 6px #7fd0ff;animation:eqtw 2.4s ease-in-out infinite;z-index:2;pointer-events:none}
.eqs.t-ring2::before{text-shadow:0 0 6px #d58bff;animation-duration:1.9s}
.eqs.t-helm2::before,.eqs.t-weapon2::before,.eqs.t-gloves2::before{content:"✦";position:absolute;right:16%;top:14%;font-size:10px;color:#ffe9a8;text-shadow:0 0 5px #f2b233;animation:eqtw 2.8s ease-in-out infinite;z-index:2;pointer-events:none}
@keyframes eqsh{0%,55%{left:-60%}100%{left:130%}}
@keyframes eqglow{50%{box-shadow:0 0 14px #c78bffcc}}
@keyframes eqbr{50%{filter:brightness(1.22) saturate(1.15)}}

@keyframes eqtw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.eqs,.eqs::after,.eqs::before,.eqs .eqi{animation:none!important}}

<script>
'use strict';
const {fmtApprox,RES,RI,B,BORDER,U,WEAK,TECH,QUESTS,MAXL,TMAX,lvl,slots,cap,rate,prodAt,upCost,upSecs,canUp,canAfford,maxBatch,trainSecs,techCost,techSecs,gatherSecs,marchSecs,fmt,fmtT,fmtRes,fmtComp,verdict,battle,carryOf,TIERN,TIER_NEED,MAXT,HSK,MAXHL,MAXSK,tierOf,heroOf,tmul,unitName,xpNeed,tierCost,tierSecs}=Core;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=o=>Object.values(o).reduce((x,y)=>x+(y||0),0);

let S=null,TOKEN='',off=0,seenLog=0,busy=false,lastSync=0,syncing=false,failCount=0;
const ui={clan:null,clanAt:0,leaveSure:false,tab:'city',tn:{spear:10,archer:10,cav:10},modal:null,rank:null,rankAt:0,authMode:'login'};
try{TOKEN=localStorage.getItem('sp_token')||'';}catch(e){}
if(window.DEMO)TOKEN='demo';

/* ---------- связь с сервером ---------- */
async function call(method,path,body){
  if(window.DEMO)return window.demoCall(method,path,body);
  const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let r;
  try{r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});}
  catch(e){const err=new Error('Нет связи с сервером');err.net=true;throw err;}
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const err=new Error(j.error||'Ошибка '+r.status);err.status=r.status;throw err;}
  return j;
}
let lastNow=0;
function setInc(a){
  const known=ui.incSeen||(ui.incSeen={});
  const fresh=a.filter(x=>!known[x.id]);
  a.forEach(x=>known[x.id]=1);
  ui.inc=a;
  if(fresh.length){try{window.Snd&&Snd.sfx('horn');}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}toast('⚔ На вас идёт нападение: '+fresh[0].name);}
  incDraw();
}
function incDraw(){
  const el=$('inc');if(!el)return;
  const now=Date.now()+off,l=(ui.inc||[]).filter(x=>x.eta>now);
  if(!l.length){el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML='⚔ <b>На вас идёт нападение!</b> '+l.map(x=>esc(x.name)+' через '+fmtT(Math.max(0,Math.ceil((x.eta-now)/1000)))).join(' · ')+'<br><span class="sm">Отправьте войска в поход, потратьте ресурсы или поднимите щит в магазине.</span>';
}
function apply(j){
  if(j.now<lastNow)return;lastNow=j.now;
  off=j.now-Date.now();Core.setNow(()=>Date.now()+off);
  Core.CFG.t=j.cfg.t;
  const first=S===null;
  S=j.state;Core.use(S);setInc(j.inc||[]);
  const fresh=S.log.filter(e=>e.t>seenLog);
  if(!first&&window.Snd&&fresh.some(e=>e.k==='bad'&&/разграбил|напал|набег/i.test(e.txt)))Snd.sfx('alarm');
  if(!first){fresh.slice(0,2).reverse().forEach(e=>toast(e.txt.length>70?e.txt.slice(0,67)+'…':e.txt));}
  if(S.log.length)seenLog=Math.max(seenLog,S.log[0].t);
  lastSync=Date.now();
}
async function sync(){
  if(syncing||!TOKEN)return;syncing=true;
  try{apply(await call('GET','/api/state'));failCount=0;$('net').hidden=true;render(true);}
  catch(e){if(e.status===401)logout(true);else{failCount++;if(failCount>=2)$('net').hidden=false;}}
  finally{syncing=false;}
}
async function act(a,arg){
  if(busy)return;busy=true;
  try{apply(await call('POST','/api/act',{a,arg}));$('net').hidden=true;}
  catch(e){if(e.status===401)logout(true);else toast(e.message);}
  finally{busy=false;}
  render();
  if(ui.eqOpen&&!$('modal').hidden){if(ui.eqSel&&ui.eqSel.id&&!S.eq.inv.some(x=>x.id===ui.eqSel.id))ui.eqSel=null;eqSheet();}
}

/* ---------- вход ---------- */
function authBg(on){const b=$('authbg'),v=$('authV');if(!b||!v)return;b.hidden=!on;if(on&&!calm()){v.play().catch(()=>{});}else if(v.pause)v.pause();}
function showAuth(){ $('app').hidden=true;$('auth').hidden=false;authBg(true);setMode(ui.authMode); }
function setMode(m){
  ui.authMode=m;
  $('tabLogin').className='btn '+(m==='login'?'on':'ghost');$('tabReg').className='btn '+(m==='reg'?'on':'ghost');
  $('auth-go').textContent=m==='login'?'Войти':'Начать игру';
  $('in-pw').autocomplete=m==='login'?'current-password':'new-password';
  $('auth-err').textContent='';
}
async function doAuth(){
  const name=$('in-name').value,password=$('in-pw').value;
  $('auth-err').textContent='';$('auth-go').classList.add('off');
  try{
    const j=await call('POST',ui.authMode==='login'?'/api/login':'/api/register',{name,password,ref:refCode()});
    TOKEN=j.token;try{localStorage.setItem('sp_token',TOKEN);}catch(e){}
    $('in-pw').value='';S=null;seenLog=0;lastNow=0;
    await startGame();
  }catch(e){$('auth-err').textContent=e.message;}
  finally{$('auth-go').classList.remove('off');}
}
function logout(silent){
  if(!silent)call('POST','/api/logout').catch(()=>{});
  TOKEN='';S=null;try{localStorage.removeItem('sp_token');}catch(e){}
  closeModal();showAuth();
}
async function startGame(){
  try{apply(await call('GET','/api/state'));}
  catch(e){if(e.status===401){logout(true);return;}$('auth').hidden=false;$('auth-err').textContent=e.message;return;}
  $('auth').hidden=true;authBg(false);$('app').hidden=false;
  {const b=$('snd');if(b)b.textContent=sndLabel();}
  render();
}

/* ---------- отрисовка ---------- */
function toast(txt){
  if(window.Snd){if(/^Победа/.test(txt))Snd.sfx('win');else if(/^Поражение/.test(txt))Snd.sfx('lose');}
  const el=$('toast');el.textContent=txt;el.hidden=false;
  clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true;},3200);
}

function questCard(q){
  const cur=Math.min(q.cur(),q.max),done=cur>=q.max,got=S.claimed[q.id];
  const rw=Object.keys(q.rw).map(k=>cpHTML(k,q.rw[k])).join('');
  return `<article class="card" style="${got?'opacity:.5':''}"><div class="qt"><b>${q.t}</b><span class="cd">${cur}/${q.max}</span></div>
    <div class="bar"><i style="width:${cur/q.max*100}%;transition:none"></i></div>
    <div class="tgb"><div class="costs" style="margin:0">${rw}</div>${got?'<span class="muted sm">Получено</span>':`<button class="btn small ${done?'':'off'}" data-act="claim" data-arg="${q.id}">Забрать</button>`}</div></article>`;
}
function viewQuests(){
  const pr=q=>Math.min(1,q.cur()/q.max);
  const ready=QUESTS.filter(q=>!S.claimed[q.id]&&q.cur()>=q.max);
  const prog=QUESTS.filter(q=>!S.claimed[q.id]&&q.cur()<q.max).sort((a,b)=>pr(b)-pr(a)||a.max-b.max);
  const got=QUESTS.filter(q=>S.claimed[q.id]);
  let h=eventsHTML()+`<h2>Задания <span class="lv">${got.length} из ${QUESTS.length}</span></h2>`;
  if(ready.length)h+=`<h3>Можно забрать</h3>`+ready.map(questCard).join('');
  h+=`<h3>В работе</h3>`+(prog.slice(0,ui.qall?999:12).map(questCard).join('')||'<p class="muted sm">Все дела выполнены.</p>');
  if(prog.length>12)h+=`<button class="btn ghost" data-act="qall">${ui.qall?'Свернуть':'Показать все ('+prog.length+')'}</button>`;
  if(got.length)h+=`<details style="margin-top:10px"><summary class="muted sm">Выполненные (${got.length})</summary>${got.map(questCard).join('')}</details>`;
  return h+inviteHTML()+`<button class="btn ghost" style="margin-top:10px" data-act="help">База знаний</button><button class="btn ghost" style="margin-top:10px" data-act="cl">История обновлений</button>`;
}

function photoToData(file){
  return new Promise((ok,no)=>{
    const r=new FileReader();r.onerror=()=>no(new Error('Не удалось прочитать файл'));
    r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('Это не картинка'));
      im.onload=()=>{
        const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');
        const m=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-m)/2,sy=(im.naturalHeight-m)/2;
        g.drawImage(im,sx,sy,m,m,0,0,96,96);
        let d=c.toDataURL('image/webp',0.8);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',0.8);
        ok(d);
      };im.src=r.result;};
    r.readAsDataURL(file);
  });
}

function bossCard(b,type,left,atk){

function wmInit(){
  const c=$('wm');if(!c)return;
  const pts=new Map();let g0=null,moved=false;
  const rect=()=>c.getBoundingClientRect();
  const toMap=(cx,cy)=>{const r=rect(),s=r.width/100*ui.wz;return {x:(cx-r.left-r.width/2)/s+ui.wcx,y:(cy-r.top-r.height/2)/s+ui.wcy};};
  const zoomAt=(cx,cy,nz)=>{const before=toMap(cx,cy);ui.wz=Math.max(1,Math.min(8,nz));const r=rect(),s=r.width/100*ui.wz;ui.wcx=before.x-(cx-r.left-r.width/2)/s;ui.wcy=before.y-(cy-r.top-r.height/2)/s;wmClamp();wmDraw();};
  const pick=(cx,cy)=>{
    const j=ui.wm&&ui.wm.j;if(!j)return;const q=toMap(cx,cy),k=rect().width/100*ui.wz;
    let best=null,bd=1e9;j.players.forEach(p=>{const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best=p;}});
    let bt=null,bdt=1e9;wmTargets().forEach(o=>{const d=Math.hypot(o.x-q.x,o.y-q.y);if(d<bdt){bdt=d;bt=o;}});
    if(bt&&bdt*k<=16&&bdt<=bd){ui.wtsel=bt.t.id;ui.wsel='';}else{ui.wtsel='';ui.wsel=best&&bd*k<=18?best.pid:'';}
    wmInfo();wmDraw();
  };
  const dist2=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});moved=false;if(pts.size===2)g0={d:dist2(),z:ui.wz};};
  c.onpointermove=e=>{
    const p=pts.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(Math.hypot(p.x-p.sx,p.y-p.sy)>6)moved=true;
    if(pts.size===2&&g0){const a=[...pts.values()];zoomAt((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,g0.z*dist2()/g0.d);moved=true;}
    else if(pts.size===1&&moved){const s=rect().width/100*ui.wz;ui.wcx-=dx/s;ui.wcy-=dy/s;wmClamp();wmDraw();}
  };
  const up=e=>{const p=pts.get(e.pointerId);pts.delete(e.pointerId);g0=null;if(p&&!moved&&e.type==='pointerup')pick(e.clientX,e.clientY);if(pts.size===1)moved=true;};
  c.onpointerup=up;c.onpointercancel=up;
  c.onwheel=e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,ui.wz*(e.deltaY<0?1.25:0.8));};
  c.ondblclick=e=>{zoomAt(e.clientX,e.clientY,ui.wz*1.8);};
  const bt=(id,f)=>{const b=$(id);if(b)b.onclick=f;};
  const mid=()=>{const r=rect();return [r.left+r.width/2,r.top+r.height/2];};
  bt('wzi',()=>zoomAt(...mid(),ui.wz*1.5));bt('wzo',()=>zoomAt(...mid(),ui.wz/1.5));
  bt('wzr',()=>{ui.wz=1;ui.wcx=50;ui.wcy=50;wmDraw();});
  bt('wzm',()=>{const m=wmMe();if(!m)return;ui.wz=Math.max(ui.wz,3);ui.wcx=m.x;ui.wcy=m.y;wmClamp();wmDraw();});
  wmInfo();wmList();wmDraw();wmLoop();loadWorld();
}

    case 'fadd':case 'faccept':case 'fdecline':case 'fremove':case 'block':case 'unblock':sact(act,{pid:arg});return;
    case 'report':sact('report',{pid:arg});return;
    case 'ccreate':cact('create',{name:$('cn').value,tag:$('ct').value});return;
    case 'cjoin':cact('join',{id:arg});return;
    case 'cleave':if(!ui.leaveSure){ui.leaveSure=true;render();setTimeout(()=>{ui.leaveSure=false;if(ui.tab==='clan')render();},4000);return;}ui.leaveSure=false;cact('leave');return;
    case 'ckick':cact('kick',{pid:arg});return;
    case 'ctrans':cact('transfer',{pid:arg});return;
    case 'cnews':{const el=$('cnews');const t=el?el.value.trim():'';if(!t)return;el.value='';cact('news',{text:t});return;}
    case 'csay':{const el=$('cmsg');const t=el?el.value.trim():'';if(!t)return;el.value='';cact('say',{text:t});return;}
    case 'cask':cact('ask',{kind:arg});return;
    case 'chelp':cact('help',{id:arg});return;
    case 'chelpall':cact('helpall');return;
    case 'tn':{const[k,d]=arg.split(':');ui.tn[k]=Math.max(1,Math.min(maxBatch(),ui.tn[k]+parseInt(d,10)));render();return;}
    case 'atk':openModal(arg);return;
    case 'step':{const[k,d]=arg.split(':');const el=$('sn-'+k);if(el){el.value=Math.max(0,Math.min(S.troops[k],(parseInt(el.value,10)||0)+parseInt(d,10)));modalPreview();}return;}
    case 'all':for(const k in U){const el=$('sn-'+k);if(el)el.value=S.troops[k];}modalPreview();return;
    case 'cancel':closeModal();return;
    case 'go':{const id=ui.modal,s=readSend(),n=S.marches.length;closeModal();ui.tab='map';act2('march',{id,send:s}).then(()=>{if(S.marches.length>n&&window.Snd)Snd.sfx('march');});return;}
    case 'train':act2('train',{k:arg,n:ui.tn[arg]});return;
    case 'logout':logout(false);return;
    case 'invshare':{const l=inviteLink(),txt='Играй со мной в Nordika: сердце фьерда, стратегию про викингов. Ссылка: '+l;
      if(navigator.share){navigator.share({title:'Nordika',text:txt,url:l}).catch(()=>{});}
      else{try{navigator.clipboard.writeText(l).then(()=>toast('Ссылка скопирована'),()=>{const i=$('invl');if(i){i.select();}toast('Выделите и скопируйте ссылку');});}catch(e){const i=$('invl');if(i)i.select();}}return;}
    case 'snd':sndCycle();return;
    case 'switch':{const b=$('sw');if(!ui.swSure){ui.swSure=true;if(b){b.textContent='Точно выйти?';b.classList.add('sure');}setTimeout(()=>{ui.swSure=false;const c=$('sw');if(c){c.textContent='Сменить аккаунт';c.classList.remove('sure');}},4000);return;}ui.swSure=false;logout(false);return;}
    case 'demo':window.demoControl(arg);seenLog=0;lastNow=0;S=null;sync();return;
    default:act2(act,arg);
  }
}
function act2(a,arg){return act(a,arg);}
function boot(){
  document.querySelectorAll('img[data-l]').forEach(i=>{i.src=(window.LOGO&&LOGO[i.dataset.l])||('/img/'+i.dataset.l+'.webp');});
  buildStatic();
  $('view').addEventListener('scroll',()=>{
    ui.sat=Date.now();
    const hd=$('head'),t=$('view').scrollTop;
    if(ui.tab!=='city')return;
    if(t>70&&!hd.classList.contains('mini')){hd.classList.add('mini');$('h1').classList.remove('off');}
    else if(t<8&&hd.classList.contains('mini')){hd.classList.remove('mini');$('h1').classList.add('off');}
  },{passive:true});
  document.addEventListener('click',e=>{
    if(e.target.id==='modal'){closeModal();return;}
    window.Snd&&Snd.unlock();
    const el=e.target.closest('[data-act]');if(!el)return;
    if(el.tagName==='A')e.preventDefault();
    if(el.classList.contains('off')||el.disabled){window.Snd&&Snd.sfx('err');return;}
    sndFor(el.dataset.act);
    onAct(el.dataset.act,el.dataset.arg);
  });
  document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('sn'))modalPreview();});
  $('tabLogin').onclick=()=>setMode('login');$('tabReg').onclick=()=>setMode('reg');
  $('auth-go').onclick=doAuth;
  $('in-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
  setInterval(()=>{
    if(!S||$('app').hidden)return;
    live();
    if(Date.now()-lastSync>2500&&dueSoon())sync();
  },1000);
  setInterval(()=>{if(S&&!document.hidden&&!ui.modal)sync();},15000);
  setInterval(()=>{if(S)incDraw();},1000);
  const avT=setInterval(()=>{if(S&&!$('app').hidden){clearInterval(avT);loadAvatar();}},1500);
  const clT=setInterval(()=>{if(S&&S.introDone&&!$('app').hidden){clearInterval(clT);loadChangelog(true);}},3000);
  setInterval(()=>{if(S&&!document.hidden&&ui.tab==='map'&&ui.msub==='world')loadWorld();},12000);
  setInterval(()=>{if(S&&!document.hidden&&ui.tab==='map'&&ui.msub==='boss')loadBoss();},15000);
  setInterval(()=>{if(S&&!document.hidden&&!$('app').hidden&&!cbusy&&(ui.tab==='clan'||(ui.tab==='chat'&&ui.sub==='clan')||Date.now()-ui.clanAt>30000))loadClan();},5000);
  setInterval(()=>{if(S&&!document.hidden&&!$('app').hidden&&(ui.tab==='chat'||Date.now()-ui.soc.at>20000))loadSoc();},4000);
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target){const m={cnews:'cnews',cmsg:'csay',wmsg:'wsay',dmsg:'dsay',fname:'fsearch'}[e.target.id];if(m){e.preventDefault();onAct(m);}}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S)sync();});
  if(!window.DEMO&&'serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const hs=document.querySelector('#heroV source');
  if(hs)hs.addEventListener('error',()=>{heroOK=false;$('hero').hidden=true;});
  document.addEventListener('visibilitychange',()=>{if(!heroOK)return;const v=ui.tab==='troops'?$('heroB'):$('heroV');if(!v)return;if(document.hidden)v.pause();else if((ui.tab==='city'||ui.tab==='troops')&&!calm())v.play().catch(()=>{});});
  if(TOKEN)startGame();else showAuth();
}
boot();
</script>
