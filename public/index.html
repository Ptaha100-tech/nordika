/* неоновые руны: горят то ярче, то тусклее, изредка моргают */
.rn{text-shadow:0 0 5px currentColor,0 0 12px currentColor}

  0%,100%{opacity:1;text-shadow:0 0 5px currentColor,0 0 12px currentColor,0 0 24px currentColor}
  34%{opacity:.55;text-shadow:0 0 2px currentColor,0 0 6px currentColor}
  50%{opacity:.92;text-shadow:0 0 4px currentColor,0 0 10px currentColor,0 0 18px currentColor}
  64%{opacity:1}
  67%{opacity:.45}
  70%{opacity:1}
  73%{opacity:.7}
  76%{opacity:1}
}

    <div class="whorow"><div class="who" id="who"></div><button class="swbtn" id="sw" data-act="switch" type="button">Сменить аккаунт</button></div>

</div>

<script src="/core.js"></script>
<script>/*PICS*/window.PIC={};[['hall',6],['farm',6],['sawmill',6],['quarry',6],['ironmine',6],['storehouse',6],['vault',6],['barracks',6],['oracle',6],['silvermine',6],['plot',1],['spear',7],['archer',7],['cav',7],['hero',7]].forEach(function(a){PIC[a[0]]=[];for(var i=1;i<=a[1];i++)PIC[a[0]].push('/img/'+a[0]+i+'.webp');});</script>
<script src="/art.js"></script>
<script>
'use strict';
const {RES,RI,B,BORDER,U,WEAK,TECH,QUESTS,MAXL,TMAX,lvl,slots,cap,rate,prodAt,upCost,upSecs,canUp,canAfford,maxBatch,trainSecs,techCost,techSecs,gatherSecs,marchSecs,fmt,fmtT,fmtRes,fmtComp,verdict,battle,carryOf,TIERN,TIER_NEED,MAXT,HSK,MAXHL,MAXSK,tierOf,heroOf,tmul,unitName,xpNeed,tierCost,tierSecs}=Core;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=o=>Object.values(o).reduce((x,y)=>x+(y||0),0);

let S=null,TOKEN='',off=0,seenLog=0,busy=false,lastSync=0,syncing=false,failCount=0;
const ui={clan:null,clanAt:0,leaveSure:false,tab:'city',tn:{spear:10,archer:10,cav:10},modal:null,rank:null,rankAt:0,authMode:'login'};
try{TOKEN=localStorage.getItem('sp_token')||'';}catch(e){}
if(window.DEMO)TOKEN='demo';

/* ---------- связь с сервером ---------- */
async function call(method,path,body){
  if(window.DEMO)return window.demoCall(method,path,body);
  const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let r;
  try{r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});}
  catch(e){const err=new Error('Нет связи с сервером');err.net=true;throw err;}
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const err=new Error(j.error||'Ошибка '+r.status);err.status=r.status;throw err;}
  return j;
}
let lastNow=0;
function apply(j){
  if(j.now<lastNow)return;lastNow=j.now;
  off=j.now-Date.now();Core.setNow(()=>Date.now()+off);
  Core.CFG.t=j.cfg.t;
  const first=S===null;
  S=j.state;Core.use(S);
  const fresh=S.log.filter(e=>e.t>seenLog);
  if(!first){fresh.slice(0,2).reverse().forEach(e=>toast(e.txt.length>70?e.txt.slice(0,67)+'…':e.txt));}
  if(S.log.length)seenLog=Math.max(seenLog,S.log[0].t);
  lastSync=Date.now();
}
async function sync(){
  if(syncing||!TOKEN)return;syncing=true;
  try{apply(await call('GET','/api/state'));failCount=0;$('net').hidden=true;render();}
  catch(e){if(e.status===401)logout(true);else{failCount++;if(failCount>=2)$('net').hidden=false;}}
  finally{syncing=false;}
}
async function act(a,arg){
  if(busy)return;busy=true;
  try{apply(await call('POST','/api/act',{a,arg}));$('net').hidden=true;}
  catch(e){if(e.status===401)logout(true);else toast(e.message);}
  finally{busy=false;}
  render();
}

/* ---------- вход ---------- */
function authBg(on){const b=$('authbg'),v=$('authV');if(!b||!v)return;b.hidden=!on;if(on&&!calm()){v.play().catch(()=>{});}else if(v.pause)v.pause();}
function showAuth(){ $('app').hidden=true;$('auth').hidden=false;authBg(true);setMode(ui.authMode); }
function setMode(m){
  ui.authMode=m;
  $('tabLogin').className='btn '+(m==='login'?'on':'ghost');$('tabReg').className='btn '+(m==='reg'?'on':'ghost');
  $('auth-go').textContent=m==='login'?'Войти':'Начать игру';
  $('in-pw').autocomplete=m==='login'?'current-password':'new-password';
  $('auth-err').textContent='';
}
async function doAuth(){
  const name=$('in-name').value,password=$('in-pw').value;
  $('auth-err').textContent='';$('auth-go').classList.add('off');
  try{
    const j=await call('POST',ui.authMode==='login'?'/api/login':'/api/register',{name,password});
    TOKEN=j.token;try{localStorage.setItem('sp_token',TOKEN);}catch(e){}
    $('in-pw').value='';S=null;seenLog=0;lastNow=0;
    await startGame();
  }catch(e){$('auth-err').textContent=e.message;}
  finally{$('auth-go').classList.remove('off');}
}
function logout(silent){
  if(!silent)call('POST','/api/logout').catch(()=>{});
  TOKEN='';S=null;try{localStorage.removeItem('sp_token');}catch(e){}
  closeModal();showAuth();
}
async function startGame(){
  try{apply(await call('GET','/api/state'));}
  catch(e){if(e.status===401){logout(true);return;}$('auth').hidden=false;$('auth-err').textContent=e.message;return;}
  $('auth').hidden=true;authBg(false);$('app').hidden=false;
  $('who').textContent='Ярл '+S.name;
  render();
}

/* ---------- отрисовка ---------- */
function toast(txt){
  const el=$('toast');el.textContent=txt;el.hidden=false;
  clearTimeout(toast.h);toast.h=setTimeout(()=>{el.hidden=true;},3200);
}
function cpHTML(k,val,attrs){
  if(k==='haste')return `<span class="cp"><i class="rn" style="color:var(--frost)">ᛞ</i><span class="cl">Ускорение</span> ${val}</span>`;
  if(k==='gems')return `<span class="cp"><i class="rn" style="color:#e6b3ff">ᛝ</i><span class="cl">Рунные камни</span> ${val}</span>`;
  return `<span class="cp"${attrs||''}><i class="rn" style="color:var(--${k})">${RI[k].r}</i><span class="cl">${RI[k].n}</span> ${fmt(val)}</span>`;
}
function costHTML(c){
  return `<div class="costs">${Object.keys(c).map(k=>cpHTML(k,c[k],` data-res="${k}" data-need="${c[k]}"`)).join('')}</div>`;
}
function effect(id,L){
  const b=B[id],nx=L<MAXL;
  if(b.res)return `Добыча: ${fmt(prodAt(id,L))}/ч`+(nx?` → ${fmt(prodAt(id,L+1))}/ч`:'');
  if(id==='storehouse')return `Вместимость: ${fmt(Core.capAt(L,lvl('hall')))}`+(nx?` → ${fmt(Core.capAt(L+1,lvl('hall')))}`:'');
  if(id==='vault')return `Прячет от грабежа: ${fmt(300*L)} каждого ресурса`+(nx?` → ${fmt(300*(L+1))}`:'');
  if(id==='barracks')return `Обучение +${15*(L-1)}%, партия до ${10*L}`+(nx?` → +${15*L}%, до ${10*(L+1)}`:'');
  if(id==='oracle')return L?`Знания доступны до ур. ${L}`+(nx?` → ${L+1}`:''):'Откроет знания Оракула';
  if(id==='hall')return `Потолок зданий: ур. ${L} · походов одновременно: ${slots(L)}`+(nx?` → ур. ${L+1}`+(slots(L+1)>slots(L)?`, походов ${slots(L+1)}`:''):'');
  return '';
}
function jobHTML(tag,txt,o,kind){
  const btns=kind?`<div class="jb"><button class="btn small" data-act="haste" data-arg="${kind}" ${S.haste<1?'disabled':''}>−5 мин · 1 <i class="rn">ᛞ</i> ускор.</button><button class="btn small ghost" data-act="free" data-arg="${kind}" data-free="${o.end}" hidden>Завершить</button></div>`:'';
  return `<div class="job"><div class="jh"><span class="tag">${tag}</span><b>${esc(txt)}</b><span class="cd" data-end="${o.end}" data-dur="${o.dur}"></span></div><div class="bar"><i class="pb"></i></div>${btns}</div>`;
}
function jobsHTML(scope){
  const j=[];
  if(scope==='city'&&S.q)j.push(jobHTML('Стройка',`${B[S.q.id].n} → ур. ${S.q.to}`,S.q,'q'));
  if(scope==='troops'||scope==='city'){
    if(S.train)j.push(jobHTML('Казарма',`${S.train.n} × ${U[S.train.type].n}`,S.train,'train'));
    if(S.upg)j.push(jobHTML('Казарма',`${unitName(S.upg.key,S.upg.to)} (ступень ${S.upg.to})`,S.upg,'upg'));
    if(S.study)j.push(jobHTML('Оракул',`${TECH[S.study.key].n} → ур. ${S.study.to}`,S.study,'study'));
  }
  if(scope==='map')S.marches.forEach(m=>{
    const o=m.phase==='out'?{end:m.arrive,dur:m.dur}:m.phase==='gather'?{end:m.gEnd,dur:gatherSecs()*1000}:{end:m.back,dur:m.dur};
    const txt=m.phase==='out'?`К «${m.tgt.name}»`:m.phase==='gather'?`Сбор: «${m.tgt.name}»`:`Домой с «${m.tgt.name}»`;
    j.push(jobHTML('Поход',txt+` · ${fmtComp(m.send)}`,o,null));
  });
  return j.length?`<section class="card"><h2>В работе</h2>${j.join('')}</section>`:'';
}
function viewCity(){
  let h='';
  if(!S.introDone)h+=`<section class="card"><h3>Добро пожаловать, ярл</h3>
    <p class="sm" style="margin:6px 0 10px">Стройте и улучшайте здания, пока копится добыча. Копите дружину в Казарме и ходите в походы: на разбойников, на ресурсные точки и на города других игроков. Таймеры идут и при закрытой игре. Пока вас нет, на город могут напасть, поэтому держите дома войско и стройте Хранилище.</p>
    <button class="btn" data-act="intro">Понятно</button></section>`;
  h+=jobsHTML('city');
  BORDER.forEach(id=>{
    const b=B[id],L=lvl(id),block=canUp(id),busyB=S.q&&S.q.id===id;
    let act='';
    if(block)act=`<p class="note">${block}</p>`;
    else if(S.q&&!busyB)act=`<p class="note">Строители заняты</p>`;
    else if(busyB)act=`<p class="note">Идёт стройка</p>`;
    else act=costHTML(upCost(id,L))+`<button class="btn" data-act="up" data-arg="${id}" data-gate="1">${L?'Улучшить':'Построить'} · ${fmtT(upSecs(id,L))}</button>`;
    h+=`<article class="card bld"><canvas class="pic" width="152" height="152" data-b="${id}" aria-label="${b.n}, уровень ${L}"></canvas><div class="bb">
      <div class="bt"><h3>${b.n}</h3><span class="lv">${L?'Ур. '+L:'Нет'}</span></div>
      <p class="bd">${effect(id,L)}</p>${act}</div></article>`;
  });
  return h;
}
function viewTroops(){
  let h=jobsHTML('troops');
  const away={spear:0,archer:0,cav:0};
  S.marches.forEach(m=>{for(const k in m.send)away[k]+=m.send[k];});
  h+=`<section class="card"><h2>Дружина дома</h2><div class="stats">${Object.keys(U).map(k=>`<div class="stat"><b>${S.troops[k]}</b><span>${U[k].pl}</span></div>`).join('')}</div>
    ${sum(away)?`<p class="note">В походах: ${fmtComp(away)}</p>`:''}</section>`;
  h+=heroHTML();
  Object.keys(U).forEach(k=>{
    const u=U[k],ok=lvl('barracks')>=u.need,tr=tierOf(S,k),tm=tmul(tr);
    const n=Math.max(1,Math.min(ui.tn[k],maxBatch()||1));ui.tn[k]=n;
    const c={};for(const r in u.cost)c[r]=u.cost[r]*n;
    h+=`<article class="card bld"><canvas class="pic tall" width="152" height="200" data-u="${k}" data-t="${tr}" aria-label="${unitName(k,tr)}"></canvas><div class="bb"><div class="bt"><h3>${unitName(k,tr)}</h3><span class="lv">Ступень ${tr}</span></div><p class="lv" style="margin-top:3px;white-space:normal">Атака ${Math.round(u.atk*tm)} · Защита ${Math.round(u.def*tm)} · Ноша ${Math.round(u.carry*tm)}</p>
      <p class="bd">Бьёт сильнее: ${U[u.counters].pl.toLowerCase()}. Уязвим к: ${U[WEAK[k]].pl.toLowerCase()}.</p>`;
    if(!ok)h+=`<p class="note">Нужна Казарма ур. ${u.need}</p>`;
    else{
      h+=`<div class="stepper"><button class="btn ghost small" data-act="tn" data-arg="${k}:-5">−5</button><button class="btn ghost small" data-act="tn" data-arg="${k}:-1">−1</button><b>${n}</b><button class="btn ghost small" data-act="tn" data-arg="${k}:1">+1</button><button class="btn ghost small" data-act="tn" data-arg="${k}:5">+5</button></div>`;
      h+=costHTML(c);
      h+=S.train?`<p class="note">Казарма занята</p>`:`<button class="btn" data-act="train" data-arg="${k}" data-gate="1">Обучить ${n} · ${fmtT(trainSecs(k,n))}</button>`;
    }
    if(ok){
      if(tr>=MAXT)h+=`<p class="note">Высшая ступень</p>`;
      else{
        const to=tr+1,need=TIER_NEED[to-1];
        h+=`<div class="tierbox"><b>Ступень ${to}: ${TIERN[k][to-1]}</b> <span class="muted sm">+30% к силе и ноше всех воинов этого вида</span>`;
        if(lvl('barracks')<need)h+=`<p class="note">Нужна Казарма ур. ${need}</p>`;
        else if(S.upg)h+=`<p class="note">Казарма улучшает воинов</p>`;
        else h+=costHTML(tierCost(k,to))+`<button class="btn" data-act="tierup" data-arg="${k}" data-gate="1">Улучшить воинов · ${fmtT(tierSecs(to))}</button>`;
        h+=`</div>`;
      }
    }
    h+=`</div></article>`;
  });
  h+=`<h2 style="margin-top:6px">Знания Оракула</h2>`;
  if(!lvl('oracle'))h+=`<section class="card"><p class="note">Постройте Оракул, чтобы изучать знания.</p></section>`;
  Object.keys(TECH).forEach(k=>{
    const t=TECH[k],L=S.tech[k];
    let act='';
    if(L>=TMAX)act=`<p class="note">Максимальный уровень</p>`;
    else if(lvl('oracle')<L+1)act=`<p class="note">Нужен Оракул ур. ${L+1}</p>`;
    else if(S.study)act=`<p class="note">Оракул занят</p>`;
    else act=costHTML(techCost(L))+`<button class="btn" data-act="study" data-arg="${k}" data-gate="1">Изучить · ${fmtT(techSecs(L))}</button>`;
    h+=`<article class="card bld"><div class="plate"><i class="rn glow d${k.length%4}">${t.r}</i><span class="cap">${TL[k]}</span></div><div class="bb"><div class="bt"><h3>${t.n}</h3><span class="lv">Ур. ${L}</span></div><p class="bd">${t.d}</p>${act}</div></article>`;
  });
  return h;
}
function heroHTML(){
  const H=heroOf(S),maxed=H.lv>=MAXHL,need=xpNeed(H.lv);
  let h=`<article class="card bld"><canvas class="pic tall" width="152" height="200" data-hero="${H.lv}" aria-label="Ярл"></canvas><div class="bb"><div class="bt"><h3>Ярл ${esc(S.name)}</h3><span class="lv">Ур. ${H.lv}</span></div>
    <div class="bar" style="margin:6px 0 2px"><i style="width:${maxed?100:Math.min(100,H.xp/need*100)}%"></i></div>
    <p class="bd">${maxed?'Высший уровень':`Опыт ${Math.floor(H.xp)} из ${need}`}${H.sp?` · <b style="color:var(--accent)">очков навыков: ${H.sp}</b>`:''}</p></div></article>`;
  h+=`<section class="card"><h2>Навыки ярла</h2>`;
  Object.keys(HSK).forEach(k=>{
    const L=H.sk[k]||0;
    h+=`<div class="trow2" style="margin:8px 0"><div style="min-width:0"><b>${HSK[k].n}</b> <span class="lv">${L}/${MAXSK}</span><p class="sm muted">${HSK[k].d}</p></div><button class="btn small" data-act="skill" data-arg="${k}" ${H.sp<1||L>=MAXSK?'disabled':''}>+1</button></div>`;
  });
  return h+`<p class="note">Опыт приходит за победы, сбор и отбитые набеги. Каждый уровень даёт очко навыка.</p></section>`;
}
const TL={atk:'Атака',def:'Защита',eco:'Экономика'};
const KIND={node:'Ресурсная точка',camp:'Разбойники',jarl:'Ярл',player:'Игрок'};
ui.msub='node';
const MSUB=[['node','Сбор'],['camp','Охота'],['pvp','ПВП'],['world','Мир']];
function viewMap(){
  const free=slots(lvl('hall'))-S.marches.length;
  const cdl=Math.max(0,Math.ceil((S.tgtAt+30000-Core.now())/1000));
  const grp=t=>t.kind==='node'?'node':t.kind==='camp'?'camp':'pvp';
  const cnt={node:0,camp:0,pvp:0};S.targets.forEach(t=>cnt[grp(t)]++);
  let h=jobsHTML('map');
  h+=`<section class="card trow2"><span>Свободных отрядов: <b>${free}</b> из ${slots(lvl('hall'))}</span><button class="btn ghost small" data-act="refresh" ${cdl?'disabled':''}>Новые цели</button></section>`;
  h+=`<div class="msub">${MSUB.map(m=>`<button class="btn ${ui.msub===m[0]?'on':'ghost'}" data-act="msub" data-arg="${m[0]}">${m[1]} <span class="muted sm">${m[0]==='world'?'':cnt[m[0]]}</span></button>`).join('')}</div>`;
  if(ui.msub==='world')return h+worldMapHTML();
  const note={node:'Мирные места, где отряд собирает ресурсы. Чем дальше точка, тем дольше путь.',camp:'Разбойники грабят округу. Победите их и заберите добычу.',pvp:'Здесь можно напасть на других ярлов. Живые игроки идут первыми, при нехватке их заменяют отряды ярлов.'}[ui.msub];
  h+=`<p class="note" style="margin:0 0 8px">${note}</p>`;
  const list=S.targets.filter(t=>grp(t)===ui.msub).sort((a,b)=>(a.kind==='player'?0:1)-(b.kind==='player'?0:1)||a.dist-b.dist);
  if(!list.length)h+=`<p class="muted sm">Целей нет. Нажмите «Новые цели».</p>`;
  list.forEach(t=>{
    const v=verdict(t);
    const sh=t.kind==='player'&&t.shieldAt>Core.now();
    const loot=t.kind==='player'?'<p class="bd">Можно забрать до четверти запасов за вычетом того, что прячет Хранилище.</p>':`<div class="costs" style="margin-bottom:0">${Object.keys(t.loot).map(k=>cpHTML(k,t.loot[k])).join('')}</div>`;
    h+=`<article class="card tg ${t.kind}"><div class="trow2"><span class="kind">${KIND[t.kind]} · ур. ${t.level}</span><span class="pill ${sh?'mute':v.c}">${sh?'Под щитом':v.t}</span></div>
      <h3 style="margin-top:2px">${esc(t.name)}</h3>
      ${t.kind==='node'?'':`<p class="bd">${t.kind==='player'?'Разведка: ':''}${fmtComp(t.comp)||'войск не видно'}</p>`}${loot}
      <div class="tgb"><span class="muted sm">Расстояние ${t.dist} лиг · в пути ${fmtT(marchSecs(t.dist))} в одну сторону</span><button class="btn ${free>0&&sum(S.troops)?'':'off'}" data-act="atk" data-arg="${t.id}">${t.kind==='node'?'Собрать':'Напасть'}</button></div></article>`;
  });
  return h;
}
function viewQuests(){
  return eventsHTML()+`<h2>Задания</h2>`+QUESTS.map(q=>{
    const cur=Math.min(q.cur(),q.max),done=cur>=q.max,got=S.claimed[q.id];
    const rw=Object.keys(q.rw).map(k=>cpHTML(k,q.rw[k])).join('');
    return `<article class="card" style="${got?'opacity:.5':''}"><div class="qt"><b>${q.t}</b><span class="cd">${cur}/${q.max}</span></div>
      <div class="bar"><i style="width:${cur/q.max*100}%;transition:none"></i></div>

let wmAnim=0;
function wmDraw(){
  const c=$('wm');if(!c)return;const j=ui.wm&&ui.wm.j;
  const W=c.clientWidth||340,dpr=Math.min(2,window.devicePixelRatio||1);
  if(c.width!==Math.round(W*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(W*dpr);}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const k=W/100,X=x=>x*k,tn=Core.now(),tt=Date.now()/1000;
  g.fillStyle='#0c161c';g.fillRect(0,0,W,W);
  // ландшафт: постоянные пятна «воды» и «лесов», чтобы карта не была пустой
  let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let i=0;i<46;i++){const x=rnd()*100,y=rnd()*100,r=4+rnd()*11,wat=rnd()<.35;g.fillStyle=wat?'rgba(40,86,120,.30)':'rgba(46,92,64,.24)';g.beginPath();g.ellipse(X(x),X(y),X(r),X(r*(.55+rnd()*.5)),rnd()*3,0,7);g.fill();}
  g.strokeStyle='rgba(180,200,210,.07)';g.lineWidth=1;
  for(let i=10;i<100;i+=10){g.beginPath();g.moveTo(X(i),0);g.lineTo(X(i),W);g.moveTo(0,X(i));g.lineTo(W,X(i));g.stroke();}
  g.strokeStyle='rgba(217,164,65,.5)';g.strokeRect(.5,.5,W-1,W-1);
  if(!j)return;
  const me=wmMe(),myTag=me&&me.clan;
  // отряды
  j.marches.forEach(m=>{
    const col=m.mine?'#f2cd75':m.inc?'#ff6a55':'#8fb0c4',pu=m.inc?.6+.4*Math.sin(tt*6):1;
    g.globalAlpha=(m.mine||m.inc?.85:.5)*pu;g.strokeStyle=col;g.lineWidth=m.mine||m.inc?1.6:1;g.setLineDash(m.inc?[5,4]:[3,4]);
    g.beginPath();g.moveTo(X(m.ax),X(m.ay));g.lineTo(X(m.bx),X(m.by));g.stroke();g.setLineDash([]);
    let p=m.ph==='out'?1-(m.eta-tn)/m.du:m.ph==='back'?(m.eta-tn)/m.du:1;p=Math.max(0,Math.min(1,p));
    const x=X(m.ax+(m.bx-m.ax)*p),y=X(m.ay+(m.by-m.ay)*p);
    g.globalAlpha=1;g.fillStyle=col;g.beginPath();g.arc(x,y,m.mine||m.inc?3.4:2.4,0,7);g.fill();
    if(m.ph==='gather'){g.strokeStyle=col;g.beginPath();g.arc(x,y,5+Math.sin(tt*3)*1.5,0,7);g.stroke();}
  });
  g.globalAlpha=1;
  // города
  j.players.forEach(p=>{
    const x=X(p.x),y=X(p.y),r=2.4+Math.min(5,p.hall*.22);
    const col=p.me?'#f2cd75':(myTag&&p.clan===myTag)?'#7fb4ff':'#d97b6c';
    if(p.me){g.strokeStyle='rgba(242,205,117,.55)';g.lineWidth=1.5;g.beginPath();g.arc(x,y,r+3+Math.sin(tt*2.4)*1.6,0,7);g.stroke();}
    if(p.pid===ui.wsel){g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(x,y,r+5,0,7);g.stroke();}
    g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();
    g.fillStyle='rgba(8,12,16,.55)';g.beginPath();g.arc(x,y,r*.45,0,7);g.fill();
    if(p.online){g.fillStyle='#fff';g.beginPath();g.arc(x+r*.8,y-r*.8,1.5,0,7);g.fill();}
    if(p.me||p.pid===ui.wsel){g.font='600 11px system-ui,sans-serif';g.textAlign='center';g.fillStyle='#ece6d6';g.strokeStyle='rgba(0,0,0,.7)';g.lineWidth=3;const ly=y-r-6<14?y+r+13:y-r-6;g.strokeText(p.name,x,ly);g.fillText(p.name,x,ly);}
  });
}

    case 'profx':ui.soc.prof=null;render();return;
    case 'fsearch':{const el=$('fname');const n=el?el.value.trim():'';if(n)openProf({name:n});return;}
    case 'dmopen':ui.sub='dm';ui.soc.peer=arg;ui.soc.prof=null;ui.soc.d&&(ui.soc.d.thread=null);render();loadSoc().then(()=>stick($('dbox')));return;
    case 'dmback':ui.soc.peer=null;render();loadSoc();return;
    case 'wsay':{const el=$('wmsg');const t=el?el.value.trim():'';if(!t)return;el.value='';sact('wsay',{text:t});return;}
    case 'dsay':{const el=$('dmsg');const t=el?el.value.trim():'';if(!t||!ui.soc.peer)return;el.value='';sact('dsay',{to:ui.soc.peer,text:t});return;}
    case 'fadd':case 'faccept':case 'fdecline':case 'fremove':case 'block':case 'unblock':sact(act,{pid:arg});return;
    case 'report':sact('report',{pid:arg});return;
    case 'ccreate':cact('create',{name:$('cn').value,tag:$('ct').value});return;
    case 'cjoin':cact('join',{id:arg});return;
    case 'cleave':if(!ui.leaveSure){ui.leaveSure=true;render();setTimeout(()=>{ui.leaveSure=false;if(ui.tab==='clan')render();},4000);return;}ui.leaveSure=false;cact('leave');return;
    case 'ckick':cact('kick',{pid:arg});return;
    case 'ctrans':cact('transfer',{pid:arg});return;
    case 'csay':{const el=$('cmsg');const t=el?el.value.trim():'';if(!t)return;el.value='';cact('say',{text:t});return;}
    case 'cask':cact('ask',{kind:arg});return;
    case 'chelp':cact('help',{id:arg});return;
    case 'chelpall':cact('helpall');return;
    case 'tn':{const[k,d]=arg.split(':');ui.tn[k]=Math.max(1,Math.min(maxBatch(),ui.tn[k]+parseInt(d,10)));render();return;}
    case 'atk':openModal(arg);return;
    case 'step':{const[k,d]=arg.split(':');const el=$('sn-'+k);if(el){el.value=Math.max(0,Math.min(S.troops[k],(parseInt(el.value,10)||0)+parseInt(d,10)));modalPreview();}return;}
    case 'all':for(const k in U){const el=$('sn-'+k);if(el)el.value=S.troops[k];}modalPreview();return;
    case 'cancel':closeModal();return;
    case 'go':{const id=ui.modal,s=readSend();closeModal();ui.tab='map';act2('march',{id,send:s});return;}
    case 'train':act2('train',{k:arg,n:ui.tn[arg]});return;
    case 'logout':logout(false);return;
    case 'switch':{const b=$('sw');if(!ui.swSure){ui.swSure=true;if(b){b.textContent='Точно выйти?';b.classList.add('sure');}setTimeout(()=>{ui.swSure=false;const c=$('sw');if(c){c.textContent='Сменить аккаунт';c.classList.remove('sure');}},4000);return;}ui.swSure=false;logout(false);return;}
    case 'demo':window.demoControl(arg);seenLog=0;lastNow=0;S=null;sync();return;
    default:act2(act,arg);
  }
}
function act2(a,arg){act(a,arg);}
function boot(){
  document.querySelectorAll('img[data-l]').forEach(i=>{i.src=(window.LOGO&&LOGO[i.dataset.l])||('/img/'+i.dataset.l+'.webp');});
  buildStatic();
  $('view').addEventListener('scroll',()=>{
    const hd=$('head'),t=$('view').scrollTop;
    if(ui.tab!=='city')return;
    if(t>70&&!hd.classList.contains('mini')){hd.classList.add('mini');$('h1').classList.remove('off');}
    else if(t<8&&hd.classList.contains('mini')){hd.classList.remove('mini');$('h1').classList.add('off');}
  },{passive:true});
  document.addEventListener('click',e=>{
    if(e.target.id==='modal'){closeModal();return;}
    const el=e.target.closest('[data-act]');if(!el||el.classList.contains('off')||el.disabled)return;
    onAct(el.dataset.act,el.dataset.arg);
  });
  document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('sn'))modalPreview();});
  $('tabLogin').onclick=()=>setMode('login');$('tabReg').onclick=()=>setMode('reg');
  $('auth-go').onclick=doAuth;
  $('in-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
  setInterval(()=>{
    if(!S||$('app').hidden)return;
    live();
    if(Date.now()-lastSync>2500&&dueSoon())sync();
  },1000);
  setInterval(()=>{if(S&&!document.hidden&&!ui.modal)sync();},20000);
  setInterval(()=>{if(S&&!document.hidden&&ui.tab==='map'&&ui.msub==='world')loadWorld();},12000);
  setInterval(()=>{if(S&&!document.hidden&&!$('app').hidden&&!cbusy&&(ui.tab==='clan'||Date.now()-ui.clanAt>30000))loadClan();},5000);
  setInterval(()=>{if(S&&!document.hidden&&!$('app').hidden&&(ui.tab==='chat'||Date.now()-ui.soc.at>20000))loadSoc();},4000);
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target){const m={cmsg:'csay',wmsg:'wsay',dmsg:'dsay',fname:'fsearch'}[e.target.id];if(m){e.preventDefault();onAct(m);}}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S)sync();});
  if(!window.DEMO&&'serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const hs=document.querySelector('#heroV source');
  if(hs)hs.addEventListener('error',()=>{heroOK=false;$('hero').hidden=true;});
  document.addEventListener('visibilitychange',()=>{if(!heroOK)return;const v=ui.tab==='troops'?$('heroB'):$('heroV');if(!v)return;if(document.hidden)v.pause();else if((ui.tab==='city'||ui.tab==='troops')&&!calm())v.play().catch(()=>{});});
  if(TOKEN)startGame();else showAuth();
}
boot();
</script>
</body>
